name: CCGE Audit Regression
on:
  push:
    branches:
      - audit/ccge-v1-62-7-validation
  workflow_dispatch:
jobs:
  static-and-crd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const re=/<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
          let match,count=0;
          while((match=re.exec(html))){
            if(/\bsrc=/.test(match[1]))continue;
            new Function(match[2]);
            count++;
          }
          if(count<7)throw Error('Expected at least 7 inline JS blocks, got '+count);
          console.log('Validated',count,'inline JS blocks');
          NODE
      - name: Run CRD parser regression
        run: node tests/crd-parser.test.js
      - name: Run multiline supplier regression
        run: node tests/crd-layout.test.js
      - name: Run invoice upload pipeline regression
        run: node tests/invoice-pipeline.test.js
      - name: Run financial zero and legacy regression
        run: node tests/financial-zero.test.js
      - name: Run attachment cleanup regression
        run: node tests/attachment-cleanup.test.js
      - name: Run concurrent upload regression
        run: node tests/upload-race.test.js
