name: CCGE homologation browser smoke
on:
  push:
    branches: [test/ccge-supabase-homologacao]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p artifacts && node tests/homologation-browser.cjs
        env:
          CCGE_TEST_EMAIL: ${{ secrets.CCGE_TEST_EMAIL }}
          CCGE_TEST_PASSWORD: ${{ secrets.CCGE_TEST_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ccge-browser-evidence
          path: artifacts/
